# Table (<table-wrap>) conversion cases. Loaded by convert.spec.ts with all tests/*.yml.

cases:
  - source: bioRxiv 10.1101/2025.10.22.684031v1 tbls5
    title: table-wrap with label, titled caption, paragraph and xref converts to table container
    jats: |-
      <table-wrap id="tbls5" orientation="portrait" position="float">
      <label>Supplementary Table 5.</label>
      <caption><title>Developability characteristics of the most enriched combinatorial variants of N49P7-FR VL reformatted as IgG1</title><p>Red shading indicates developability liabilities, with color intensity proportional to severity. Variants in bold demonstrated the most favorable biophysical profiles and were selected for HIV neutralization analysis (<xref rid="figs15" ref-type="fig">Supplementary Fig. 15</xref>).</p></caption>
      <graphic xlink:href="684031v1_tbls5.tif"/>
      </table-wrap>
    mdast:
      type: container
      kind: table
      label: tbls5
      identifier: tbls5
      children:
        - type: caption
          children:
            - type: paragraph
              children:
                - type: strong
                  children:
                    - type: text
                      value: Developability characteristics of the most enriched combinatorial variants of N49P7-FR VL reformatted as IgG1
            - type: paragraph
              children:
                - type: crossReference
                  kind: figure
                  label: figs15
                  identifier: figs15
                  children:
                    - type: text
                      value: Supplementary Fig. 15
        - type: image
          url: 684031v1_tbls5.tif

  - source: bioRxiv 10.1101/713717v2 utbl1
    title: table-wrap with graphic only renders as bare image without container
    jats: |-
      <table-wrap orientation="portrait" position="anchor">
      <graphic xlink:href="713717v2_utbl1.tif"/>
      </table-wrap>
    mdast:
      type: image
      url: 713717v2_utbl1.tif

  - source: bioRxiv 10.1101/713717v1 utbl1
    title: table-wrap with id and graphic only keeps xref target on image without container
    jats: |-
      <table-wrap id="utbl1" orientation="portrait" position="float">
      <graphic xlink:href="713717v1_utbl1.tif"/>
      </table-wrap>
    mdast:
      type: image
      url: 713717v1_utbl1.tif
      label: utbl1
      identifier: utbl1

  - title: table-wrap with id and table element keeps xref target on table without container
    jats: |-
      <table-wrap id="utbl2">
      <table><tbody><tr><td>cell</td></tr></tbody></table>
      </table-wrap>
    mdast:
      type: table
      label: utbl2
      identifier: utbl2

  - title: table-wrap with empty caption renders without container
    jats: |-
      <table-wrap orientation="portrait" position="anchor">
      <caption></caption>
      <graphic xlink:href="bare.tif"/>
      </table-wrap>
    mdast:
      type: image
      url: bare.tif

  - title: table-wrap with only table element renders without container
    jats: |-
      <table-wrap><table><tbody><tr><td>cell</td></tr></tbody></table></table-wrap>
    mdast:
      type: table

  - title: table-wrap with footnote renders as container
    jats: |-
      <table-wrap orientation="portrait" position="anchor">
      <graphic xlink:href="tbl.tif"/>
      <table-wrap-foot><fn><p>Footnote text</p></fn></table-wrap-foot>
      </table-wrap>
    mdast:
      type: container
      kind: table
      children:
        - type: legend
